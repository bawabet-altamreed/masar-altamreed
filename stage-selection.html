<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="اختيار المرحلة الدراسية في منصة مسار التمريض."
>

<meta
    name="theme-color"
    content="#0b2a43"
>

<title>اختيار المرحلة | مسار التمريض</title>

<link
    rel="stylesheet"
    href="styles/main.css"
>

<style>

    .stage-page {

        min-height: calc(100vh - 76px);

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 40px 16px;

        background: var(--background);

    }


    .stage-card {

        width: min(100%, 650px);

        background: var(--white);

        border: 1px solid var(--border);

        border-radius: 24px;

        padding: 35px;

        box-shadow: var(--shadow);

    }


    .stage-icon {

        width: 70px;

        height: 70px;

        margin: 0 auto 18px;

        display: flex;

        align-items: center;

        justify-content: center;

        background: var(--accent-light);

        border-radius: 20px;

        font-size: 35px;

    }


    .stage-heading {

        text-align: center;

        margin-bottom: 28px;

    }


    .stage-heading h1 {

        color: var(--primary);

        font-size: 28px;

        margin-bottom: 10px;

    }


    .stage-heading p {

        color: var(--text-light);

        font-size: 14px;

        line-height: 1.8;

    }


    .stages-grid {

        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 12px;

    }


    .stage-option {

        position: relative;

    }


    .stage-option input {

        position: absolute;

        opacity: 0;

        pointer-events: none;

    }


    .stage-option label {

        min-height: 95px;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 8px;

        padding: 15px;

        border: 2px solid var(--border);

        border-radius: 16px;

        background: #fff;

        color: var(--primary);

        text-align: center;

        font-size: 14px;

        font-weight: 800;

        cursor: pointer;

        transition: 0.2s ease;

    }


    .stage-option label span {

        font-size: 26px;

    }


    .stage-option label:hover {

        border-color: var(--accent);

        background: var(--accent-light);

    }


    .stage-option input:checked + label {

        border-color: var(--accent);

        background: var(--accent-light);

        box-shadow:
            0 0 0 3px rgba(24, 166, 200, 0.1);

    }


    .stage-submit {

        width: 100%;

        border: none;

        margin-top: 22px;

    }


    .stage-message {

        display: none;

        margin-top: 15px;

        padding: 12px 14px;

        border-radius: 10px;

        text-align: center;

        font-size: 13px;

        line-height: 1.8;

    }


    .stage-message.error {

        display: block;

        background: #fff0f0;

        color: #b42318;

    }


    .stage-message.success {

        display: block;

        background: #ecfdf3;

        color: #067647;

    }


    @media (max-width: 600px) {

        .stage-card {

            padding: 25px 18px;

            border-radius: 20px;

        }


        .stage-heading h1 {

            font-size: 24px;

        }


        .stages-grid {

            grid-template-columns: 1fr;

        }

    }

</style>

</head><body><header class="site-header"><div class="container header-inner">

    <a
        href="index.html"
        class="brand"
    >

        <span class="brand-icon">
            🩺
        </span>

        <span class="brand-text">
            مسار التمريض
        </span>

    </a>

</div>

</header><main class="stage-page"><div class="stage-card">


    <div class="stage-icon">
        🎓
    </div>


    <div class="stage-heading">

        <h1>
            اختر مرحلتك الدراسية
        </h1>

        <p>
            اختر المرحلة التي تدرس بها حاليًا
            لاستكمال إنشاء حسابك في مسار التمريض.
        </p>

    </div>



    <form id="stageForm">


        <div class="stages-grid">


            <div class="stage-option">

                <input
                    type="radio"
                    name="stage"
                    id="first-secondary"
                    value="first-secondary"
                >

                <label for="first-secondary">

                    <span>🎓</span>

                    أولى ثانوي تمريض

                </label>

            </div>



            <div class="stage-option">

                <input
                    type="radio"
                    name="stage"
                    id="second-secondary"
                    value="second-secondary"
                >

                <label for="second-secondary">

                    <span>🎓</span>

                    تانية ثانوي تمريض

                </label>

            </div>



            <div class="stage-option">

                <input
                    type="radio"
                    name="stage"
                    id="third-secondary"
                    value="third-secondary"
                >

                <label for="third-secondary">

                    <span>🎓</span>

                    تالتة ثانوي تمريض

                </label>

            </div>



            <div class="stage-option">

                <input
                    type="radio"
                    name="stage"
                    id="first-institute"
                    value="first-institute"
                >

                <label for="first-institute">

                    <span>🏥</span>

                    أولى معهد تمريض

                </label>

            </div>



            <div class="stage-option">

                <input
                    type="radio"
                    name="stage"
                    id="second-institute"
                    value="second-institute"
                >

                <label for="second-institute">

                    <span>🏥</span>

                    تانية معهد تمريض

                </label>

            </div>


        </div>



        <button
            type="submit"
            class="btn btn-primary btn-large stage-submit"
            id="stageSubmit"
        >
            حفظ المرحلة والمتابعة
        </button>


    </form>



    <div
        id="stageMessage"
        class="stage-message"
    ></div>


</div>

</main><script type="module">


import {
    auth,
    db
} from "./src/firebase/config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



const stageForm =
    document.getElementById(
        "stageForm"
    );


const stageSubmit =
    document.getElementById(
        "stageSubmit"
    );


const stageMessage =
    document.getElementById(
        "stageMessage"
    );



let currentUser = null;



/* =========================================
   الرسائل
========================================= */

function showMessage(
    message,
    type = "error"
) {

    stageMessage.textContent =
        message;

    stageMessage.className =
        "stage-message " + type;

}



/* =========================================
   التأكد من تسجيل الدخول
========================================= */

onAuthStateChanged(
    auth,
    async function (user) {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            user;


        try {

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const snapshot =
                await getDoc(
                    userRef
                );


            if (!snapshot.exists()) {

                showMessage(
                    "لم يتم العثور على بيانات حسابك. يرجى إنشاء الحساب من جديد."
                );

                stageSubmit.disabled =
                    true;

                return;

            }


            const data =
                snapshot.data();


            /*
             * لو المرحلة موجودة بالفعل
             * لا نحتاج هذه الصفحة.
             */

            if (data.stage) {

                window.location.href =
                    "pending.html";

            }

        }

        catch (error) {

            console.error(error);

            showMessage(
                "حدث خطأ أثناء تحميل بيانات الحساب."
            );

        }

    }
);



/* =========================================
   حفظ المرحلة
========================================= */

stageForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        if (!currentUser) {

            showMessage(
                "يجب تسجيل الدخول أولًا."
            );

            return;

        }


        const selectedStage =
            document.querySelector(
                'input[name="stage"]:checked'
            );


        if (!selectedStage) {

            showMessage(
                "من فضلك اختر المرحلة الدراسية أولًا."
            );

            return;

        }


        try {

            stageSubmit.disabled =
                true;


            stageSubmit.textContent =
                "جاري حفظ المرحلة...";


            const userRef =
                doc(
                    db,
                    "users",
                    currentUser.uid
                );


            await updateDoc(
                userRef,
                {

                    stage:
                        selectedStage.value,

                    accountStatus:
                        "pending",

                    subscriptionStatus:
                        "none",

                    updatedAt:
                        serverTimestamp()

                }
            );


            showMessage(
                "تم حفظ المرحلة بنجاح. حسابك الآن قيد مراجعة الإدارة.",
                "success"
            );


            setTimeout(
                function () {

                    window.location.href =
                        "pending.html";

                },
                1200
            );

        }


        catch (error) {

            console.error(error);

            showMessage(
                "حدث خطأ أثناء حفظ المرحلة. حاول مرة أخرى."
            );


            stageSubmit.disabled =
                false;


            stageSubmit.textContent =
                "حفظ المرحلة والمتابعة";

        }

    }
);


</script></body></html>
