<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>إنشاء حساب | مسار التمريض</title>

    <link rel="stylesheet" href="/src/styles/main.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <div class="brand-icon">
                    🩺
                </div>

                <h1>
                    إنشاء حساب
                </h1>

                <p>
                    ابدأ رحلتك التعليمية مع مسار التمريض
                </p>

            </div>

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        الاسم بالكامل
                    </label>

                    <input
                        id="name"
                        type="text"
                        required
                        autocomplete="name"
                        placeholder="اكتب اسمك بالكامل"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        id="email"
                        type="email"
                        required
                        autocomplete="email"
                        placeholder="example@email.com"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        id="password"
                        type="password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                        placeholder="••••••••"
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-large auth-submit"
                >
                    إنشاء الحساب
                </button>

                <div
                    id="registerMessage"
                    class="auth-message"
                    aria-live="polite"
                ></div>

               <button
    type="button"
    id="googleRegisterBtn"
    class="google-btn"
>
    <span class="google-icon">G</span>
    التسجيل باستخدام Google
</button>
            </form>


            <div class="auth-footer">

                لديك حساب بالفعل؟

                <a href="/login.html">
                    تسجيل الدخول
                </a>

            </div>

        </section>

    </main>

<script type="module">

    import {
        registerUser,
        loginWithGoogle
    } from "/src/firebase/auth.js";

    import {
        createUserProfile
    } from "/src/firebase/firestore.js";

    import {
        ROLES
    } from "/src/core/roles.js";


    const form =
        document.getElementById("registerForm");

    const googleButton =
        document.getElementById("googleRegisterBtn");

    const message =
        document.getElementById("registerMessage");


    async function createStudentProfile(user) {

        await createUserProfile(
            user.uid,
            {
                name:
                    user.displayName || "طالب جديد",

                email:
                    user.email,

                role:
                    ROLES.STUDENT,

                status:
                    "pending",

                stageId:
                    null,

                gradeId:
                    null,

                subscriptionStatus:
                    "inactive"
            }
        );

    }


    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            message.textContent =
                "جاري إنشاء الحساب...";


            try {

                const user =
                    await registerUser(
                        email,
                        password,
                        name
                    );


                await createStudentProfile(user);


                message.textContent =
                    "تم إنشاء الحساب بنجاح.";


                setTimeout(() => {

                    window.location.href =
                        "/student/dashboard.html";

                }, 1000);


            } catch (error) {

                console.error(error);

                message.textContent =
                    getAuthErrorMessage(error);

            }

        }
    );


    googleButton.addEventListener(
        "click",
        async () => {

            message.textContent =
                "جاري تسجيل الدخول باستخدام Google...";


            try {

                const user =
                    await loginWithGoogle();


                await createStudentProfile(user);


                message.textContent =
                    "تم إنشاء الحساب بنجاح.";


                setTimeout(() => {

                    window.location.href =
                        "/student/dashboard.html";

                }, 1000);


            } catch (error) {

                console.error(error);

                message.textContent =
                    getAuthErrorMessage(error);

            }

        }
    );


    function getAuthErrorMessage(error) {

        switch (error.code) {

            case "auth/email-already-in-use":
                return "البريد الإلكتروني مستخدم بالفعل.";

            case "auth/invalid-email":
                return "البريد الإلكتروني غير صحيح.";

            case "auth/weak-password":
                return "كلمة المرور يجب أن تكون أقوى.";

            case "auth/popup-closed-by-user":
                return "تم إغلاق نافذة Google.";

            case "auth/popup-blocked":
                return "المتصفح منع نافذة تسجيل الدخول.";

            default:
                return "حدث خطأ. حاول مرة أخرى.";

        }

    }

</script>

            
</body>

</html>
