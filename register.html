<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="إنشاء حساب جديد في منصة مسار التمريض."
>

<meta
    name="theme-color"
    content="#0b2a43"
>

<title>إنشاء حساب | مسار التمريض</title>

<link rel="stylesheet" href="styles/main.css">

<style>

    .auth-page {
        min-height: calc(100vh - 76px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
        background: var(--background);
    }

    .auth-card {
        width: min(100%, 500px);
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 35px;
        box-shadow: var(--shadow);
    }

    .auth-logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent-light);
        border-radius: 20px;
        font-size: 36px;
    }

    .auth-heading {
        text-align: center;
        margin-bottom: 28px;
    }

    .auth-heading h1 {
        color: var(--primary);
        font-size: 30px;
        margin-bottom: 8px;
    }

    .auth-heading p {
        color: var(--text-light);
        font-size: 14px;
        line-height: 1.7;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .form-group label {
        color: var(--primary);
        font-size: 14px;
        font-weight: 700;
    }

    .form-group input,
    .form-group select,
    .google-stage-box select {
        width: 100%;
        min-height: 50px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 11px;
        outline: none;
        background: #fff;
        color: var(--text);
        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .google-stage-box select:focus {
        border-color: var(--accent);
        box-shadow:
            0 0 0 3px rgba(24, 166, 200, 0.1);
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-left: 55px;
    }

    .password-toggle {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 18px;
        padding: 5px;
    }

    .terms {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-top: 2px;
        color: var(--text-light);
        font-size: 12px;
        line-height: 1.7;
    }

    .terms input {
        margin-top: 5px;
        accent-color: var(--accent);
    }

    .auth-submit {
        width: 100%;
        border: none;
        margin-top: 4px;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0;
        color: var(--text-light);
        font-size: 13px;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .google-btn {
        width: 100%;
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: #fff;
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
    }

    .google-btn:hover {
        border-color: var(--accent);
        background: var(--accent-light);
    }

    .google-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .google-icon {
        font-size: 20px;
        font-weight: 900;
    }

    .auth-message {
        display: none;
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        text-align: center;
        font-size: 13px;
        line-height: 1.8;
    }

    .auth-message.error {
        display: block;
        background: #fff0f0;
        color: #b42318;
    }

    .auth-message.warning {
        display: block;
        background: #fff8e7;
        color: #9a6700;
    }

    .auth-message.success {
        display: block;
        background: #ecfdf3;
        color: #067647;
    }

    .google-stage-box {
        display: none;
        margin-top: 20px;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #f8fbfd;
    }

    .google-stage-box h3 {
        color: var(--primary);
        margin-bottom: 8px;
        font-size: 19px;
    }

    .google-stage-box p {
        color: var(--text-light);
        font-size: 13px;
        line-height: 1.7;
        margin-bottom: 15px;
    }

    .save-google-stage {
        width: 100%;
        border: none;
        margin-top: 14px;
    }

    .login-link {
        margin-top: 24px;
        text-align: center;
        color: var(--text-light);
        font-size: 14px;
    }

    .login-link a {
        color: var(--accent);
        font-weight: 800;
    }

    .back-home {
        display: block;
        margin-top: 18px;
        text-align: center;
        color: var(--text-light);
        font-size: 13px;
    }

    .back-home:hover {
        color: var(--accent);
    }

    @media (max-width: 600px) {

        .auth-page {
            padding: 30px 12px;
        }

        .auth-card {
            padding: 26px 20px;
            border-radius: 20px;
        }

        .auth-heading h1 {
            font-size: 26px;
        }

        .form-row {
            grid-template-columns: 1fr;
        }

    }

</style>

</head><body><header class="site-header"><div class="container header-inner">

    <a
        href="index.html"
        class="brand"
    >

        <span class="brand-icon">
            🩺
        </span>

        <span class="brand-text">
            مسار التمريض
        </span>

    </a>


    <div class="header-actions">

        <a
            href="index.html"
            class="btn btn-outline"
        >
            الرئيسية
        </a>

    </div>

</div>

</header><main class="auth-page"><div class="auth-card">


    <div class="auth-logo">
        🩺
    </div>


    <div class="auth-heading">

        <h1>
            إنشاء حساب
        </h1>

        <p>
            أنشئ حسابك وابدأ رحلتك في مسار التمريض
        </p>

    </div>



    <form
        id="registerForm"
        class="auth-form"
    >


        <div class="form-row">


            <div class="form-group">

                <label for="firstName">
                    الاسم الأول
                </label>

                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="الاسم الأول"
                    autocomplete="given-name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="lastName">
                    اسم العائلة
                </label>

                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    placeholder="اسم العائلة"
                    autocomplete="family-name"
                    required
                >

            </div>


        </div>



        <div class="form-group">

            <label for="email">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                autocomplete="email"
                required
            >

        </div>



        <div class="form-group">

            <label for="stage">
                المرحلة الدراسية
            </label>

            <select
                id="stage"
                name="stage"
                required
            >

                <option value="">
                    اختر المرحلة الدراسية
                </option>

                <option value="first-secondary">
                    أولى ثانوي تمريض
                </option>

                <option value="second-secondary">
                    تانية ثانوي تمريض
                </option>

                <option value="third-secondary">
                    تالتة ثانوي تمريض
                </option>

                <option value="first-institute">
                    أولى معهد تمريض
                </option>

                <option value="second-institute">
                    تانية معهد تمريض
                </option>

            </select>

        </div>



        <div class="form-group">

            <label for="password">
                كلمة المرور
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="6 أحرف أو أكثر"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="passwordToggle"
                >
                    👁️
                </button>

            </div>

        </div>



        <div class="form-group">

            <label for="confirmPassword">
                تأكيد كلمة المرور
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="أعد كتابة كلمة المرور"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="confirmPasswordToggle"
                >
                    👁️
                </button>

            </div>

        </div>



        <label class="terms">

            <input
                type="checkbox"
                id="terms"
                required
            >

            <span>
                أوافق على شروط استخدام المنصة وسياسة الخصوصية.
            </span>

        </label>



        <button
            type="submit"
            class="btn btn-primary btn-large auth-submit"
        >
            إنشاء الحساب
        </button>


    </form>



    <div class="divider">
        أو
    </div>



    <button
        type="button"
        class="google-btn"
        id="googleRegister"
    >

        <span class="google-icon">
            G
        </span>

        <span>
            التسجيل باستخدام Google
        </span>

    </button>



    <div
        id="googleStageBox"
        class="google-stage-box"
    >

        <h3>
            اختر مرحلتك الدراسية
        </h3>

        <p>
            اختر المرحلة التي تدرس بها حاليًا لإكمال إنشاء حسابك.
        </p>


        <select id="googleStage">

            <option value="">
                اختر المرحلة الدراسية
            </option>

            <option value="first-secondary">
                أولى ثانوي تمريض
            </option>

            <option value="second-secondary">
                تانية ثانوي تمريض
            </option>

            <option value="third-secondary">
                تالتة ثانوي تمريض
            </option>

            <option value="first-institute">
                أولى معهد تمريض
            </option>

            <option value="second-institute">
                تانية معهد تمريض
            </option>

        </select>


        <button
            type="button"
            id="saveGoogleStage"
            class="btn btn-primary btn-large save-google-stage"
        >
            متابعة
        </button>

    </div>



    <div
        id="authMessage"
        class="auth-message"
    ></div>



    <div class="login-link">

        لديك حساب بالفعل؟

        <a href="login.html">
            تسجيل الدخول
        </a>

    </div>



    <a
        href="index.html"
        class="back-home"
    >
        ← العودة إلى الرئيسية
    </a>


</div>

</main><script type="module">

import {
    registerWithEmail,
    loginWithGoogle,
    saveGoogleStage
} from "./src/firebase/auth.js";


const registerForm =
    document.getElementById("registerForm");

const googleRegister =
    document.getElementById("googleRegister");

const authMessage =
    document.getElementById("authMessage");

const googleStageBox =
    document.getElementById("googleStageBox");

const googleStage =
    document.getElementById("googleStage");

const saveGoogleStageButton =
    document.getElementById("saveGoogleStage");


let googleUser = null;



function showMessage(message, type = "error") {

    authMessage.textContent = message;

    authMessage.className =
        "auth-message " + type;

}



function setupPasswordToggle(inputId, buttonId) {

    const input =
        document.getElementById(inputId);

    const button =
        document.getElementById(buttonId);


    if (!input || !button) {
        return;
    }


    button.addEventListener(
        "click",
        function () {

            if (input.type === "password") {

                input.type = "text";

                button.textContent = "🙈";

            } else {

                input.type = "password";

                button.textContent = "👁️";

            }

        }
    );

}


setupPasswordToggle(
    "password",
    "passwordToggle"
);


setupPasswordToggle(
    "confirmPassword",
    "confirmPasswordToggle"
);



registerForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const firstName =
            document.getElementById("firstName").value.trim();


        const lastName =
            document.getElementById("lastName").value.trim();


        const email =
            document.getElementById("email").value.trim();


        const stage =
            document.getElementById("stage").value;


        const password =
            document.getElementById("password").value;


        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (!firstName || !lastName) {

            showMessage(
                "من فضلك اكتب اسمك بالكامل."
            );

            return;

        }


        if (!stage) {

            showMessage(
                "من فضلك اختر المرحلة الدراسية."
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
            );

            return;

        }


        if (password !== confirmPassword) {

            showMessage(
                "كلمتا المرور غير متطابقتين."
            );

            return;

        }


        const button =
            registerForm.querySelector(
                'button[type="submit"]'
            );


        try {

            button.disabled = true;

            button.textContent =
                "جاري إنشاء الحساب...";


            const fullName =
                `${firstName} ${lastName}`;


            await registerWithEmail(
                email,
                password,
                {
                    name: fullName,
                    stage: stage
                }
            );


            showMessage(
                "تم إنشاء حسابك بنجاح. حسابك الآن قيد مراجعة الإدارة.",
                "success"
            );


            registerForm.reset();

        }

        catch (error) {

            console.error(error);


            let message =
                "حدث خطأ أثناء إنشاء الحساب.";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                message =
                    "هذا البريد الإلكتروني مستخدم بالفعل.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "البريد الإلكتروني غير صحيح.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                message =
                    "كلمة المرور ضعيفة. استخدم كلمة مرور أقوى.";

            }

            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                message =
                    "حدثت مشكلة في الاتصال بالإنترنت.";

            }


            showMessage(message);

        }

        finally {

            button.disabled = false;

            button.textContent =
                "إنشاء الحساب";

        }

    }
);



googleRegister.addEventListener(
    "click",
    async function () {

        try {

            googleRegister.disabled = true;

            googleRegister.innerHTML =
                "جاري الاتصال بـ Google...";


            googleUser =
                await loginWithGoogle();


            googleStageBox.style.display =
                "block";


            googleRegister.style.display =
                "none";


            showMessage(
                "تم تسجيل الدخول باستخدام Google. اختر مرحلتك الدراسية لإكمال الحساب.",
                "success"
            );

        }

        catch (error) {

            console.error(error);


            let message =
                "تعذر التسجيل باستخدام Google.";


            if (
                error.code ===
                "auth/popup-closed-by-user"
            ) {

                message =
                    "تم إغلاق نافذة Google قبل إكمال التسجيل.";

            }

            else if (
                error.code ===
                "auth/popup-blocked"
            ) {

                message =
                    "المتصفح منع نافذة Google. اسمح بالنوافذ المنبثقة وحاول مرة أخرى.";

            }

            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                message =
                    "حدثت مشكلة في الاتصال بالإنترنت.";

            }


            showMessage(message);

            googleRegister.disabled = false;

            googleRegister.innerHTML =
                '<span class="google-icon">G</span><span>التسجيل باستخدام Google</span>';

        }

    }
);



saveGoogleStageButton.addEventListener(
    "click",
    async function () {

        if (!googleUser) {

            showMessage(
                "لم يتم العثور على حساب Google. أعد المحاولة."
            );

            return;

        }


        const stage =
            googleStage.value;


        if (!stage) {

            showMessage(
                "من فضلك اختر المرحلة الدراسية."
            );

            return;

        }


        try {

            saveGoogleStageButton.disabled =
                true;

            saveGoogleStageButton.textContent =
                "جاري حفظ البيانات...";


            await saveGoogleStage(
                googleUser.uid,
                stage
            );


            showMessage(
                "تم إنشاء حسابك بنجاح. حسابك الآن قيد مراجعة الإدارة.",
                "success"
            );


            googleStageBox.style.display =
                "none";


            saveGoogleStageButton.textContent =
                "تم التسجيل بنجاح";

        }

        catch (error) {

            console.error(error);

            showMessage(
                "حدث خطأ أثناء حفظ المرحلة. حاول مرة أخرى."
            );

            saveGoogleStageButton.textContent =
                "متابعة";

        }

        finally {

            saveGoogleStageButton.disabled =
                false;

        }

    }
);

</script></body>
</html>
