<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../src/styles/main.css"><title>مسار التمريض</title></head><body><div id="app"></div><script type="module">
import{db}from'../src/firebase/config.js';import{guard,esc,date}from'../src/core/guard.js';import{collection,getDocs,query,where,limit}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const role='teacher',page='notifications',{p}=await guard(role,role==='student');const nav=[['dashboard.html','dashboard'],['lectures.html','lectures'],['schedule.html','schedule'],['students.html','students'],['exams.html','exams'],['results.html','results'],['files.html','files'],['notifications.html','notifications'],['profile.html','profile']];const app=document.querySelector('#app');app.innerHTML=`<aside class="side"><div class="brand">🩺 مسار التمريض</div><b>${esc(p.name||'')}</b><hr>${nav.map(x=>`<a href="${x[0]}">${x[1]}</a>`).join('')}<button id="out" class="btn">خروج</button></aside><main class="main"><h1>notifications</h1><div id="c"></div></main>`;document.querySelector('#out').onclick=async()=>{const{logout}=await import('../src/firebase/auth.js');logout()};const c=document.querySelector('#c');async function all(name){try{let s=await getDocs(query(collection(db,name),limit(100)));return s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){return[]}}function cards(a){c.innerHTML=a.length?'<div class="grid">'+a.map(x=>`<div class="card"><b>${esc(x.title||x.name||x.subscriptionCode||x.id)}</b><p class="muted">${esc(x.status||x.role||'')}</p></div>`).join('')+'</div>':'<div class="card">لا توجد بيانات حاليًا</div>'}
if(page==='dashboard'){let [u,l,e]=await Promise.all([all('users'),all('lectures'),all('exams')]);c.innerHTML=`<div class="grid"><div class="card">المستخدمون: ${u.length}</div><div class="card">المحاضرات: ${l.length}</div><div class="card">الاختبارات: ${e.length}</div><div class="card">مرحبًا ${esc(p.name||'')}</div></div>`}else{let map={lectures:'lectures',exams:'exams',results:'examAttempts',leaderboard:'leaderboard',files:'files',notifications:'notifications',students:'users',teachers:'users',stages:'stages',subjects:'subjects',groups:'groups',activity:'activityLogs',schedule:'lectures'};if(page==='profile')c.innerHTML=`<div class="card"><p>الاسم: ${esc(p.name)}</p><p>الدور: ${esc(p.role)}</p><p>حالة الحساب: ${esc(p.accountStatus)}</p><p>حالة الاشتراك: ${esc(p.subscriptionStatus||'—')}</p><p>ينتهي: ${date(p.subscriptionEnd)}</p></div>`;else if(map[page]){let a=await all(map[page]);if(page==='students')a=a.filter(x=>x.role==='student');if(page==='teachers')a=a.filter(x=>x.role==='teacher');if(role==='student'&&['lectures','exams','files'].includes(map[page]))a=a.filter(x=>!x.stageIds||x.stageIds.includes(p.stageId));cards(a)}
</script></body></html>
