<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="تسجيل الدخول إلى منصة مسار التمريض."
>

<meta
    name="theme-color"
    content="#0b2a43"
>

<title>
    تسجيل الدخول | مسار التمريض
</title>

</head><body><!-- =========================
     Authentication Page
========================== -->

<main class="auth-page">

    <section class="auth-card">


        <!-- Header -->

        <div class="auth-header">

            <a
                href="/"
                class="auth-brand"
            >

                <span class="brand-icon">
                    🩺
                </span>

                <span>
                    مسار التمريض
                </span>

            </a>


            <h1>
                تسجيل الدخول
            </h1>


            <p>
                أهلاً بك مرة أخرى 👋
            </p>

        </div>



        <!-- Login Form -->

        <form
            id="loginForm"
            novalidate
        >


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>


                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                    required
                >

            </div>



            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>


                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="••••••••"
                    required
                >

            </div>



            <!-- Login Button -->

            <button
                id="loginButton"
                type="submit"
                class="btn btn-primary btn-large auth-submit"
            >

                تسجيل الدخول

            </button>



            <!-- Google -->

            <button
                id="googleLoginButton"
                type="button"
                class="google-btn"
            >

                <span class="google-icon">
                    G
                </span>

                المتابعة باستخدام Google

            </button>



            <!-- Message -->

            <div
                id="loginMessage"
                class="auth-message"
                aria-live="polite"
            ></div>

        </form>



        <!-- Register -->

        <div class="auth-footer">

            ليس لديك حساب؟

            <a href="/register.html">
                إنشاء حساب جديد
            </a>

        </div>



        <!-- Back -->

        <div class="auth-back">

            <a href="/">
                ← العودة إلى الصفحة الرئيسية
            </a>

        </div>

    </section>

</main>



<!-- =========================
     Firebase Authentication
========================== -->

<script type="module">

    import {
        loginUser,
        loginWithGoogle
    } from "/src/firebase/auth.js";


    import {
        getUserProfile
    } from "/src/firebase/firestore.js";



    const form =
        document.getElementById("loginForm");


    const loginButton =
        document.getElementById("loginButton");


    const googleButton =
        document.getElementById("googleLoginButton");


    const message =
        document.getElementById("loginMessage");



    /*
     * تحويل المستخدم حسب بيانات حسابه
     *
     * مؤقتًا سنستخدمها لحد ما نعمل
     * Auth Guard المركزي.
     */

    async function redirectUser(user) {

        const profile =
            await getUserProfile(user.uid);


        if (!profile) {

            message.textContent =
                "تم تسجيل الدخول ولكن بيانات الحساب غير موجودة.";

            return;

        }


        if (profile.role === "admin") {

            window.location.href =
                "/admin/dashboard.html";

            return;

        }


        if (profile.role === "teacher") {

            window.location.href =
                "/teacher/dashboard.html";

            return;

        }


        if (profile.role === "student") {

            window.location.href =
                "/student/dashboard.html";

            return;

        }


        message.textContent =
            "نوع الحساب غير معروف.";

    }



    /*
     * Email / Password Login
     */

    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            if (!email || !password) {

                message.textContent =
                    "من فضلك أدخل البريد الإلكتروني وكلمة المرور.";

                return;

            }


            loginButton.disabled = true;

            googleButton.disabled = true;


            message.textContent =
                "جاري تسجيل الدخول...";


            try {

                const user =
                    await loginUser(
                        email,
                        password
                    );


                await redirectUser(user);


            } catch (error) {

                console.error(error);


                message.textContent =
                    getAuthErrorMessage(error);

            }


            loginButton.disabled = false;

            googleButton.disabled = false;

        }
    );



    /*
     * Google Login
     */

    googleButton.addEventListener(
        "click",
        async () => {

            loginButton.disabled = true;

            googleButton.disabled = true;


            message.textContent =
                "جاري فتح تسجيل الدخول باستخدام Google...";


            try {

                const user =
                    await loginWithGoogle();


                await redirectUser(user);


            } catch (error) {

                console.error(error);


                message.textContent =
                    getAuthErrorMessage(error);

            }


            loginButton.disabled = false;

            googleButton.disabled = false;

        }
    );



    /*
     * Firebase Error Messages
     */

    function getAuthErrorMessage(error) {

        switch (error.code) {

            case "auth/invalid-credential":
                return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            case "auth/user-not-found":
                return "لا يوجد حساب بهذا البريد الإلكتروني.";

            case "auth/wrong-password":
                return "كلمة المرور غير صحيحة.";

            case "auth/invalid-email":
                return "البريد الإلكتروني غير صحيح.";

            case "auth/too-many-requests":
                return "تم إجراء محاولات كثيرة. حاول مرة أخرى لاحقًا.";

            case "auth/popup-closed-by-user":
                return "تم إغلاق نافذة Google.";

            case "auth/popup-blocked":
                return "المتصفح منع نافذة تسجيل الدخول.";

            case "auth/network-request-failed":
                return "تأكد من اتصال الإنترنت وحاول مرة أخرى.";

            default:
                return "حدث خطأ أثناء تسجيل الدخول. حاول مرة أخرى.";

        }

    }

</script>


<!-- Main JavaScript / CSS -->

<script
    type="module"
    src="/src/main.js"
></script>

</body></html>
