<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="تسجيل الدخول إلى منصة مسار التمريض."
>

<meta
    name="theme-color"
    content="#0b2a43"
>

<title>تسجيل الدخول | مسار التمريض</title>

<link rel="stylesheet" href="styles/main.css">

<style>

    .auth-page {
        min-height: calc(100vh - 76px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
        background: var(--background);
    }

    .auth-card {
        width: min(100%, 460px);
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 35px;
        box-shadow: var(--shadow);
    }

    .auth-logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent-light);
        border-radius: 20px;
        font-size: 36px;
    }

    .auth-heading {
        text-align: center;
        margin-bottom: 28px;
    }

    .auth-heading h1 {
        color: var(--primary);
        font-size: 30px;
        margin-bottom: 8px;
    }

    .auth-heading p {
        color: var(--text-light);
        font-size: 14px;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .form-group label {
        color: var(--primary);
        font-size: 14px;
        font-weight: 700;
    }

    .form-group input {
        width: 100%;
        min-height: 50px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 11px;
        outline: none;
        background: #fff;
        color: var(--text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(24, 166, 200, 0.1);
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-left: 55px;
    }

    .password-toggle {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 18px;
        padding: 5px;
    }

    .forgot-password {
        text-align: left;
        margin-top: -5px;
    }

    .forgot-password button {
        border: none;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
    }

    .auth-submit {
        width: 100%;
        border: none;
        margin-top: 5px;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0;
        color: var(--text-light);
        font-size: 13px;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .google-btn {
        width: 100%;
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: #fff;
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
    }

    .google-btn:hover {
        border-color: var(--accent);
        background: var(--accent-light);
    }

    .google-icon {
        font-size: 20px;
        font-weight: 900;
    }

    .auth-message {
        display: none;
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        text-align: center;
        font-size: 13px;
    }

    .auth-message.error {
        display: block;
        background: #fff0f0;
        color: #b42318;
    }

    .auth-message.success {
        display: block;
        background: #ecfdf3;
        color: #067647;
    }

    .register-link {
        margin-top: 24px;
        text-align: center;
        color: var(--text-light);
        font-size: 14px;
    }

    .register-link a {
        color: var(--accent);
        font-weight: 800;
    }

    .back-home {
        display: block;
        margin-top: 18px;
        text-align: center;
        color: var(--text-light);
        font-size: 13px;
    }

    .back-home:hover {
        color: var(--accent);
    }

    @media (max-width: 600px) {

        .auth-page {
            padding: 30px 12px;
        }

        .auth-card {
            padding: 26px 20px;
            border-radius: 20px;
        }

        .auth-heading h1 {
            font-size: 26px;
        }

    }

</style>

</head><body><!-- HEADER -->

<header class="site-header">

    <div class="container header-inner">

        <a href="index.html" class="brand">

            <span class="brand-icon">
                🩺
            </span>

            <span class="brand-text">
                مسار التمريض
            </span>

        </a>


        <div class="header-actions">

            <a
                href="index.html"
                class="btn btn-outline"
            >
                الرئيسية
            </a>

        </div>

    </div>

</header>



<!-- LOGIN -->

<main class="auth-page">

    <div class="auth-card">


        <div class="auth-logo">
            🩺
        </div>


        <div class="auth-heading">

            <h1>
                تسجيل الدخول
            </h1>

            <p>
                ادخل إلى حسابك في مسار التمريض
            </p>

        </div>


        <form
            id="loginForm"
            class="auth-form"
        >


            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="إظهار كلمة المرور"
                    >
                        👁️
                    </button>

                </div>

            </div>



            <div class="forgot-password">

                <button
                    type="button"
                    id="forgotPassword"
                >
                    نسيت كلمة المرور؟
                </button>

            </div>



            <button
                type="submit"
                class="btn btn-primary btn-large auth-submit"
            >
                تسجيل الدخول
            </button>


        </form>



        <div class="divider">
            أو
        </div>



        <button
            type="button"
            class="google-btn"
            id="googleLogin"
        >

            <span class="google-icon">
                G
            </span>

            <span>
                المتابعة باستخدام Google
            </span>

        </button>



        <div
            id="authMessage"
            class="auth-message"
        ></div>



        <div class="register-link">

            ليس لديك حساب؟

            <a href="register.html">
                إنشاء حساب جديد
            </a>

        </div>


        <a
            href="index.html"
            class="back-home"
        >
            ← العودة إلى الرئيسية
        </a>


    </div>

</main>



<!-- مؤقتًا: وظائف الواجهة فقط -->

<script>

    const passwordInput =
        document.getElementById("password");

    const passwordToggle =
        document.getElementById("passwordToggle");


    passwordToggle.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type === "password"
            ) {

                passwordInput.type = "text";

                passwordToggle.textContent = "🙈";

            } else {

                passwordInput.type = "password";

                passwordToggle.textContent = "👁️";

            }

        }
    );


    const loginForm =
        document.getElementById("loginForm");


    loginForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            alert(
                "صفحة تسجيل الدخول جاهزة. سيتم ربطها بـ Firebase في الخطوة التالية."
            );

        }
    );


    document
        .getElementById("googleLogin")
        .addEventListener(
            "click",
            function () {

                alert(
                    "Google Login سيتم ربطه بـ Firebase في الخطوة التالية."
                );

            }
        );


    document
        .getElementById("forgotPassword")
        .addEventListener(
            "click",
            function () {

                alert(
                    "سيتم تفعيل استعادة كلمة المرور مع Firebase."
                );

            }
        );

</script>

</body></html>
