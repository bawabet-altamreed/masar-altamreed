<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="src/styles/main.css"><title>تسجيل الدخول</title></head><body class="login"><div class="box"><h1>🩺 مسار التمريض</h1><p>سجل الدخول للمتابعة</p><label>نوع الدخول</label><select id="mode"><option value="code">طالب / مدرس</option><option value="admin">الإدارة</option></select><div id="cf"><label>🔑 كود الاشتراك</label><input id="code"><label>🔒 كلمة المرور</label><input id="pass" type="password"></div><div id="af" hidden><label>البريد الإلكتروني</label><input id="email" type="email"><label>🔒 كلمة المرور</label><input id="apass" type="password"></div><button id="go" class="btn">تسجيل الدخول</button><p id="msg" class="muted"></p><p class="muted">إذا لم يكن لديك كود اشتراك، تواصل مع إدارة مسار التمريض.<br>واتساب 01222736904<br>© 2026 مسار التمريض</p></div><script type="module">import{loginByCode,loginAdmin,profile}from'./src/firebase/auth.js';const $=s=>document.querySelector(s);$('#mode').onchange=()=>{$('#cf').hidden=$('#mode').value==='admin';$('#af').hidden=!$('#cf').hidden};$('#go').onclick=async()=>{try{$('#msg').textContent='جارٍ الدخول...';let c=$('#mode').value==='admin'?await loginAdmin($('#email').value,$('#apass').value):await loginByCode($('#code').value,$('#pass').value);let p=await profile(c.user.uid);if(!p)throw Error('الحساب غير مُعد في المنصة');location.href=p.role==='admin'?'admin/dashboard.html':p.role==='teacher'?'teacher/dashboard.html':'student/dashboard.html'}catch(e){$('#msg').textContent='تعذر تسجيل الدخول: تحقق من البيانات أو إعداد الحساب.'}};</script></body></html>
